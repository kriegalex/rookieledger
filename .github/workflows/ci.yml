name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these tests on the tag before it publishes anything

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below talks to the repository; the tests run with no token on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15" # the version of the server image (server/Dockerfile), not the runner image's own
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: companion/go.mod
          cache: false
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1
      - name: Addon and server tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Companion tests
        working-directory: companion
        run: |
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 go vet ./...

  # The server image builds and both services answer in it, run as in production: a mistake shows here, not on the
  # day of a release. Nothing is published from here.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check the server image
        run: |
          docker build --build-arg VERSION=v0.0.0 -t rookieledger-server:ci server
          server/image_test.sh rookieledger-server:ci v0.0.0

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: companion/go.mod
          cache: false
      - name: Companion tests (registry, autostart entry, instance lock)
        working-directory: companion
        run: go test ./...
      # MakeAppx checks the manifest against its schema: a mistake in it shows here, not on the day of a release.
      - name: The Microsoft Store package builds
        shell: pwsh
        run: |
          go build -C companion -trimpath -ldflags "-H=windowsgui" -o dist/RookieLedgerSync.exe .
          companion/store/package.ps1 -Tag v0.0.0 -Exe companion/dist/RookieLedgerSync.exe -Out RookieLedgerSync.msix
