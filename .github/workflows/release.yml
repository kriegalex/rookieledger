name: Release

# A tag such as v0.2.0 publishes the addon (CurseForge, GitHub release) and the server image (GitHub Packages) and
# attaches the companion app, once the tests of the tagged commit have passed, the companion app is built and
# CHANGELOG.md is about that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CHANGELOG.md is the text of this release
        run: |
          # v0.2.1-beta1 is read against the heading of v0.2.1.
          version="${GITHUB_REF_NAME%%-*}"
          if [ "$(head -n 1 CHANGELOG.md | tr -d '\r')" != "# RookieLedger ${version}" ]; then
            echo "::error file=CHANGELOG.md,line=1::CHANGELOG.md must start with \"# RookieLedger ${version}\": it is published as the text of ${GITHUB_REF_NAME}"
            exit 1
          fi

  # Built before anything is published: a release whose companion app does not build publishes no addon either.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          # go.mod names 1.26 without a patch: without this, the runner image's cached 1.26.x is taken, which can lag
          # a security release of net/http or crypto/tls that the published binaries carry.
          check-latest: true
          cache: false
      - name: Test and build
        working-directory: companion
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          flags="-s -w -X main.version=${GITHUB_REF_NAME}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/rookieledger-sync-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags -H=windowsgui" -o dist/RookieLedgerSync.exe .
          cd dist && sha256sum -- * > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion
          path: companion/dist/
          if-no-files-found: error
          retention-days: 7

  # The package to upload to Partner Center by hand, kept with the workflow run: it is not signed (the Store signs
  # what it publishes), so it is of no use on the release page. It holds the released RookieLedgerSync.exe.
  store:
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the Store's version is counted from the tags
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion
          path: companion/dist
      - name: Package for the Microsoft Store
        shell: pwsh
        run: companion/store/package.ps1 -Tag $env:GITHUB_REF_NAME -Exe companion/dist/RookieLedgerSync.exe -Out RookieLedgerSync.msix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package
          path: RookieLedgerSync.msix
          if-no-files-found: error
          retention-days: 30

  # The site as an image, ghcr.io/<owner>/rookieledger-server:<tag>: what a cluster runs is the tagged commit and
  # nothing else. The run's summary gives the digest to pin in the deployment.
  image:
    needs: [test, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # pushes the image to this repository's packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, check and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rookieledger-server"
          docker build --build-arg VERSION="$GITHUB_REF_NAME" -t "$image:$GITHUB_REF_NAME" server
          server/image_test.sh "$image:$GITHUB_REF_NAME" "$GITHUB_REF_NAME"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_REF_NAME"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_REF_NAME")
          {
            echo "### Server image"
            echo
            echo "\`$image:$GITHUB_REF_NAME@${digest##*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  addon:
    needs: [test, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the packager reads the tags
          persist-credentials: false # the packager reaches GitHub with GITHUB_API_TOKEN, never through git
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GITHUB_OAUTH is the packager's deprecated name for it
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  companion:
    needs: [build, addon]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # uploads the binaries to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh below has the token in GH_TOKEN
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion
          path: companion/dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" companion/dist/* --clobber
