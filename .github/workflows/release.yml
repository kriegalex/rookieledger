name: Release

# A tag such as v0.2.0 publishes the addon (CurseForge, Wago, GitHub release) and attaches the companion app, once
# the tests of the tagged commit have passed, the companion app is built and CHANGELOG.md is about that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CHANGELOG.md is the text of this release
        run: |
          # v0.2.1-beta1 is read against the heading of v0.2.1.
          version="${GITHUB_REF_NAME%%-*}"
          if [ "$(head -n 1 CHANGELOG.md | tr -d '\r')" != "# RookieLedger ${version}" ]; then
            echo "::error file=CHANGELOG.md,line=1::CHANGELOG.md must start with \"# RookieLedger ${version}\": it is published as the text of ${GITHUB_REF_NAME}"
            exit 1
          fi

  # Built before anything is published: a release whose companion app does not build publishes no addon either.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          cache: false
      - name: Test and build
        working-directory: companion
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          flags="-s -w -X main.version=${GITHUB_REF_NAME}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/rookieledger-sync-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags -H=windowsgui" -o dist/RookieLedgerSync.exe .
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion
          path: companion/dist/
          if-no-files-found: error
          retention-days: 7

  addon:
    needs: [test, changelog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the packager reads the tags
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

  companion:
    needs: [build, addon]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # uploads the binaries to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion
          path: companion/dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" companion/dist/* --clobber
