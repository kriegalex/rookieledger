<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RookieLedger : la carte</title>
<meta name="description" content="Filons, plantes et monstres relevés par la guilde sur World of Warcraft Forever, avec ce qu'ils donnent vraiment.">
<style>
:root { --ink: #2b2118; --paper: #f1e3c0; --edge: #8a6d3b; --dim: #6b5a45; --mine: #e8762c; --herb: #3fa34d; --beast: #c0392b; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.4 Georgia, "Times New Roman", serif; color: var(--ink); background: #1d1812; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; display: block; }
#map.dragging { cursor: grabbing; }
.card { position: absolute; background: var(--paper); border: 1px solid var(--edge); border-radius: 6px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
#side { top: 12px; left: 12px; width: 250px; padding: 10px 12px; }
#side h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .5px; }
#side p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
#continents { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
button, input[type=search] { font: inherit; color: inherit; }
#continents button { flex: 1 1 auto; padding: 4px 8px; border: 1px solid var(--edge); border-radius: 4px; background: #e6d3a3; cursor: pointer; white-space: nowrap; }
#continents button:hover { background: #d9c38c; }
#search { width: 100%; padding: 5px 7px; border: 1px solid var(--edge); border-radius: 4px; background: #fbf3dc; margin-bottom: 8px; }
.layer { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
.layer .count { margin-left: auto; color: var(--dim); font-size: 12px; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .55); display: inline-block; flex: none; }
#status { margin-top: 8px; font-size: 12px; color: var(--dim); min-height: 1.4em; }
#where { left: 12px; bottom: 12px; padding: 4px 9px; font-size: 12px; }
#credit { right: 12px; bottom: 12px; padding: 4px 9px; font-size: 11px; color: var(--dim); max-width: 60%; }
#credit a { color: inherit; }
#detail { top: 12px; right: 12px; width: 330px; max-height: calc(100% - 70px); overflow: auto; padding: 10px 12px; }
#detail[hidden] { display: none; }
#detail h2 { font-size: 16px; margin: 0 26px 2px 0; }
#detail .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
#detail table { width: 100%; border-collapse: collapse; font-size: 13px; }
#detail th { text-align: left; font-weight: normal; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 6px 0 2px; }
#detail td { padding: 2px 0; border-top: 1px solid rgba(138, 109, 59, .3); }
#detail td.n { text-align: right; white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
#close { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; background: none; font-size: 18px; cursor: pointer; }
.q0 { color: #6f6f6f; } .q1 { color: var(--ink); } .q2 { color: #1a8a00; } .q3 { color: #0056b8; } .q4 { color: #8527c9; } .q5 { color: #c46100; }
.quest { color: var(--dim); font-size: 12px; }
#zoom { right: 12px; bottom: 50px; display: flex; flex-direction: column; overflow: hidden; }
#zoom button { width: 32px; height: 32px; border: 0; background: none; font-size: 18px; cursor: pointer; }
#zoom button + button { border-top: 1px solid var(--edge); }
@media (max-width: 700px) {
  #side { width: 200px; } #detail { top: auto; bottom: 46px; left: 12px; right: 12px; width: auto; max-height: 45%; }
  #credit { display: none; }
}
</style>
</head>
<body>
<canvas id="map" aria-label="Carte du monde"></canvas>
<div id="side" class="card">
  <h1>RookieLedger</h1>
  <p>Ce que la guilde a vraiment trouvé, et où.</p>
  <div id="continents"></div>
  <input id="search" type="search" placeholder="Chercher un objet, un monstre…" autocomplete="off">
  <label class="layer"><input type="checkbox" data-layer="mining" checked><span class="dot" style="background:var(--mine)"></span>Filons<span class="count" id="n-mining"></span></label>
  <label class="layer"><input type="checkbox" data-layer="herbalism" checked><span class="dot" style="background:var(--herb)"></span>Plantes<span class="count" id="n-herbalism"></span></label>
  <label class="layer"><input type="checkbox" data-layer="creature" checked><span class="dot" style="background:var(--beast)"></span>Monstres<span class="count" id="n-creature"></span></label>
  <div id="status" role="status">Chargement…</div>
</div>
<div id="detail" class="card" hidden><button id="close" aria-label="Fermer">×</button><div id="detail-body"></div></div>
<div id="zoom" class="card"><button id="zoom-in" aria-label="Zoom avant">+</button><button id="zoom-out" aria-label="Zoom arrière">−</button></div>
<div id="where" class="card">&nbsp;</div>
<div id="credit" class="card">Cartes et noms : © Blizzard Entertainment. Carte d'un seul tenant d'après
  <a href="https://github.com/openmap-world/openmap">OpenMap</a>. Relevés : la guilde, avec l'add-on
  <a href="https://github.com/kriegalex/rookieledger">RookieLedger</a>.</div>
<script src="app.js"></script>
</body>
</html>
